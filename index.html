<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Drive">
  <meta name="theme-color" content="#0b0d10">
  <meta name="robots" content="noindex">
  <title>Drive</title>
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-180.png">
  <link rel="stylesheet" href="./vendor/maplibre-gl.css">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="map"></div>

  <div id="searchbar" class="searchbar">
    <input id="q" type="search" placeholder="Where to?" autocomplete="off" autocorrect="off" enterkeyhint="search">
    <div class="quick"><button id="home" type="button">Home</button><button id="work" type="button">Work</button></div>
    <button id="usual" type="button" class="usual" hidden></button>
    <div id="leave" class="leave" hidden><span id="leave-text"></span><span class="leave-btns"><button id="leave-go" type="button">Route</button><button id="leave-x" type="button" aria-label="Cancel reminder">✕</button></span></div>
    <div id="results" class="results" hidden></div>
    <div id="gps" class="gps" role="status" hidden></div>
  </div>

  <div id="nav" class="navbar" hidden>
    <div class="nav-main"><div id="nav-arrow" class="nav-arrow">↑</div><div class="nav-text"><div id="nav-next" class="nav-next">Starting…</div><div id="nav-then" class="nav-then" hidden></div></div></div>
    <div id="lanes" class="lanes" hidden></div>
    <div class="nav-row"><span id="nav-eta"></span><span class="nav-btns"><button id="add-stop" type="button">+ Stop</button><button id="stop" type="button">End</button></span></div>
  </div>

  <div id="cam" class="cam" hidden></div>
  <div id="toast" class="toast" role="status" hidden></div>

  <div class="side">
    <div class="zoom"><button id="zoom-in" type="button" aria-label="Zoom in">+</button><button id="zoom-out" type="button" aria-label="Zoom out">−</button></div>
    <button id="recenter" type="button" hidden>Recenter</button>
    <button id="addcam" type="button" class="addcam">+ Camera</button>
    <button id="more" type="button">Menu</button>
  </div>

  <div class="speedo"><span id="speed">0</span><small>km/h</small></div>
  <div id="limit" class="limit" hidden></div>

  <div id="plan" class="sheet" hidden>
    <div id="plan-name" class="sheet-title"></div>
    <div id="plan-info" class="sheet-info"></div>
    <div id="plan-options" class="options" hidden></div>
    <div class="sheet-actions"><button id="cancel" type="button" class="ghost">Cancel</button><button id="go" type="button" class="primary">Go</button></div>
    <div class="sheet-links"><button id="set-home" type="button">Set as Home</button><button id="set-work" type="button">Set as Work</button></div>
    <div class="leave-row"><label for="arrive-by">Arrive by</label><input id="arrive-by" type="time"><span id="leave-info"></span></div>
    <div id="leave-actions" class="sheet-links" hidden><button id="leave-remind" type="button">Remind me here</button><button id="leave-calendar" type="button">Add to Calendar</button></div>
  </div>

  <div id="drives" class="modal" hidden>
    <div class="card">
      <div class="sheet-title">Drives: predicted vs real</div>
      <div id="drives-stats" class="stats"></div>
      <div id="drives-list" class="drives-list"></div>
      <div class="sheet-actions"><button id="drives-export" type="button" class="ghost">Export</button><button id="drives-close" type="button" class="primary">Close</button></div>
    </div>
  </div>

  <div id="menu" class="modal" hidden>
    <div class="card menu">
      <div class="sheet-title">Menu</div>
      <button id="voice" type="button">Voice on</button>
      <button id="theme" type="button">Theme</button>
      <button id="tilt" type="button">3D driving view</button>
      <button id="cam-voice" type="button">Camera voice</button>
      <button id="beep" type="button">Over-limit chime</button>
      <button id="avoid-tolls" type="button">Avoid tolls</button>
      <button id="avoid-motorways" type="button">Avoid motorways</button>
      <button id="log" type="button">Drives: predicted vs real</button>
      <button id="reset-quick" type="button">Clear Home and Work</button>
      <button id="restore-cams" type="button">Restore hidden cameras</button>
      <div class="sheet-actions"><button id="menu-close" type="button" class="primary">Close</button></div>
    </div>
  </div>

  <div id="stops" class="modal" hidden>
    <div class="card">
      <div class="sheet-title">Add a stop</div>
      <div id="stops-kinds" class="kinds"></div>
      <div id="stops-list" class="results in-card"></div>
      <div class="sheet-actions"><button id="stops-remove" type="button" class="ghost" hidden>Remove stop</button><button id="stops-close" type="button" class="primary">Close</button></div>
    </div>
  </div>

  <button id="start" type="button" class="start">Start<small id="start-hint">turns on voice, GPS and keeps the screen awake</small><small id="build"></small></button>

  <div id="setup" class="modal" hidden>
    <div class="card">
      <div class="sheet-title">Paste TomTom key</div>
      <input id="key-input" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="key">
      <div class="sheet-actions"><button id="save-key" type="button" class="primary">Save</button></div>
    </div>
  </div>

  <script src="./vendor/maplibre-gl.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
